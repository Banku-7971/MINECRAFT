[package]
name = "minecraft"
version = "1.0.0"
edition = "2021"

[[bin]]
name = "minecraft"
path = "src/main.rs"

[[bin]]
name = "minecraft-setup"
path = "src/installer.rs"

[lib]
name = "rustcraft"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
