name: CI Build & Test

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  checks: write

jobs:
  wasm-and-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain with wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Run library unit tests
        id: test
        shell: bash
        run: |
          set -o pipefail
          cargo test --lib 2>&1 | tee /tmp/ci-test.log

      - name: Build WebAssembly bundle
        id: wasm
        shell: bash
        run: |
          set -o pipefail
          (node scripts/build-web.mjs && node scripts/verify-web-build.mjs) 2>&1 | tee /tmp/ci-wasm.log

      - name: Report compiler failure to Check Run
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          LOG_FILE="/tmp/ci-test.log"
          if [ -f /tmp/ci-wasm.log ]; then LOG_FILE="/tmp/ci-wasm.log"; fi
          TAIL=$(tail -n 120 "$LOG_FILE" 2>/dev/null || echo "No log")
          jq -n --arg sha "$GITHUB_SHA" --arg out "$TAIL" '{
            name: "ci-diagnostics",
            head_sha: $sha,
            status: "completed",
            conclusion: "failure",
            output: { title: "Build/Test Log", summary: "Compiler or test output", text: ("```\n" + $out + "\n```") }
          }' | gh api "repos/${GITHUB_REPOSITORY}/check-runs" --method POST --input - || true

      - name: Upload built rustcraft.wasm
        uses: actions/upload-artifact@v4
        with:
          name: rustcraft-wasm
          path: web/rustcraft.wasm

      - name: Commit updated rustcraft.wasm on working branch
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/arena/') && !contains(github.event.head_commit.message, '[skip ci]')
        shell: bash
        run: |
          if ! git diff --quiet web/rustcraft.wasm; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add web/rustcraft.wasm
            git commit -m "[skip ci] Update compiled web/rustcraft.wasm"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

  windows-check:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run native tests
        shell: bash
        run: |
          set -o pipefail
          cargo test 2>&1 | tee /tmp/win-test.log

      - name: Build Windows executables
        shell: bash
        run: |
          set -o pipefail
          mkdir -p target
          (
            rustc --edition 2021 -O -C target-feature=+crt-static src/main.rs -o target/Minecraft.exe &&
            rustc --edition 2021 -O -C target-feature=+crt-static src/installer.rs -o target/Minecraft-Setup.exe &&
            ls -lh target/Minecraft.exe target/Minecraft-Setup.exe
          ) 2>&1 | tee /tmp/win-build.log

      - name: Report Windows failure to Check Run
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          LOG_FILE="/tmp/win-test.log"
          if [ -f /tmp/win-build.log ]; then LOG_FILE="/tmp/win-build.log"; fi
          TAIL=$(tail -n 120 "$LOG_FILE" 2>/dev/null || echo "No log")
          jq -n --arg sha "$GITHUB_SHA" --arg out "$TAIL" '{
            name: "win-diagnostics",
            head_sha: $sha,
            status: "completed",
            conclusion: "failure",
            output: { title: "Windows Log", summary: "Windows build/test output", text: ("```\n" + $out + "\n```") }
          }' | gh api "repos/${GITHUB_REPOSITORY}/check-runs" --method POST --input - || true
