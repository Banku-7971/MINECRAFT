name: Build & Release Windows Executables

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Minecraft.exe and Minecraft-Setup.exe
        shell: bash
        run: |
          mkdir -p runtime
          rustc --edition 2021 -O -A warnings -C target-feature=+crt-static src/main.rs -o runtime/Minecraft.exe
          rustc --edition 2021 -O -A warnings -C target-feature=+crt-static src/installer.rs -o runtime/Minecraft-Setup.exe
          ls -lh runtime/Minecraft.exe runtime/Minecraft-Setup.exe

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-executables
          path: |
            runtime/Minecraft.exe
            runtime/Minecraft-Setup.exe

      - name: Publish Windows .exe assets to GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v2.2.0"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          fi

          NOTES_FILE="$(mktemp)"
          cat <<'EOF' > "$NOTES_FILE"
          ## Windows Downloads (v2.2.0 — 100% Original Audio & Music)
          - **`Minecraft.exe`** — Portable 64-bit Windows GUI game executable (double-click to play; no Java or DLLs required).
          - **`Minecraft-Setup.exe`** — Windows GUI installer (installs to `%LOCALAPPDATA%\Minecraft`, creates Desktop & Start Menu shortcuts, and adds Windows Apps & Features uninstaller).

          ### 100% Original Sound & Music Suite
          - **3 Original Dimension Soundtracks:** Overworld (*"Sunlight & Moss"* felt-piano + pad), Nether (*"Ember Choir"* dark Phrygian drones & bells), and The End (*"Astral Drift"* Lydian crystal chimes).
          - **Original Jukebox Tracks:** *"Meadow Promenade"* and *"Basalt Bounce"* full-length multi-part grooves.
          - **Pitch-Varied Original Foley & Mob Audio:** Zero external/copyrighted audio assets; linear-interpolated pitch variation on footsteps, digging, placing, water splashes, furnace crackle, Creeper fuse hiss, explosions, and all mob voices.

          ### Included Features
          - Real `.zip` / `.mrpack` / `.json` **Resource Pack, Shader Pack, Datapack, and Modpack** loader (drop packs in `packs/` next to `Minecraft.exe`, or cycle shaders in **Options -> Shader** and `/shader`).
          - Horizon-style 3D volumetric clouds, 15x15 chunk render distance, 960x540 HD rendering, 32 3D mobs, Nether & End dimensions, Redstone, Crafting, Enchanting, Brewing, and LAN Multiplayer.
          EOF

          # Remove leading indentation from heredoc
          sed -i 's/^          //' "$NOTES_FILE"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" runtime/Minecraft.exe runtime/Minecraft-Setup.exe --clobber
          else
            gh release create "$TAG" runtime/Minecraft.exe runtime/Minecraft-Setup.exe \
              --target main \
              --title "Minecraft Rust Edition ${TAG} (Windows .exe)" \
              --notes-file "$NOTES_FILE"
          fi

          if gh release view v2.0.0 >/dev/null 2>&1; then
            gh release upload v2.0.0 runtime/Minecraft.exe runtime/Minecraft-Setup.exe --clobber
          fi
