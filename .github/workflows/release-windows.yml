name: Build & Release Windows Executables

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Minecraft.exe and Minecraft-Setup.exe
        shell: bash
        run: |
          mkdir -p runtime
          rustc --edition 2021 -O -A warnings -C target-feature=+crt-static src/main.rs -o runtime/Minecraft.exe
          rustc --edition 2021 -O -A warnings -C target-feature=+crt-static src/installer.rs -o runtime/Minecraft-Setup.exe
          ls -lh runtime/Minecraft.exe runtime/Minecraft-Setup.exe

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-executables
          path: |
            runtime/Minecraft.exe
            runtime/Minecraft-Setup.exe

      - name: Publish Windows .exe assets to GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v2.3.0"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          fi

          NOTES_FILE="$(mktemp)"
          cat <<'EOF' > "$NOTES_FILE"
          ## Windows Downloads (v2.3.0 — Java Edition UI, 3D Hand, Esc Pause, Drops, Jump & Knockback)
          - **`Minecraft.exe`** — Portable 64-bit Windows GUI game executable (double-click to play; no Java or DLLs required).
          - **`Minecraft-Setup.exe`** — Windows GUI installer (installs to `%LOCALAPPDATA%\Minecraft`, creates Desktop & Start Menu shortcuts, and adds Windows Apps & Features uninstaller).

          ### What's New in v2.3.0
          - **Java Edition Survival Inventory & Recipe Book:** Unified `#C6C6C6` panel with integrated black Steve paper-doll preview (tracks cursor + renders equipped armor/offhand), 4 armor slots + offhand silhouettes, 2×2 crafting grid, 3×9 inventory + 1×9 hotbar, and 12 distinct page-1 recipes in the Recipe Book.
          - **True 3D First-Person Hand & Held Blocks:** Perspective-projected 3D Steve forearm (with walk bob & swing animation) and true 3D held blocks.
          - **Java Edition `182×22` Hotbar & HUD:** Authentic `182×22` hotbar, `24×24` white-bevelled active slot selector, `182×5` segmented XP bar with outlined level number, and flush-aligned pixel hearts, armor, drumsticks, and air bubbles.
          - **Gameplay Polish:** Pressing `Esc` in-game reliably pauses (including on pointer-lock release), breaking blocks drops scattered item entities into the world with pickup delay, crisp Java-style jump ground-snap, and natural exponential knockback impulse & decay.

          ### Included Features
          - 100% original multi-dimension music & pitch-varied foley/mob audio, real `.zip` / `.mrpack` / `.json` **Resource Pack, Shader Pack, Datapack, and Modpack** loader, volumetric horizon clouds, 15×15 chunk render distance, 960×540 HD rendering, 32 3D mobs, Nether & End dimensions, Redstone, Crafting, Enchanting, Brewing, and LAN Multiplayer.
          EOF

          # Remove leading indentation from heredoc
          sed -i 's/^          //' "$NOTES_FILE"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" runtime/Minecraft.exe runtime/Minecraft-Setup.exe --clobber
          else
            gh release create "$TAG" runtime/Minecraft.exe runtime/Minecraft-Setup.exe \
              --target main \
              --title "Minecraft Rust Edition ${TAG} (Windows .exe)" \
              --notes-file "$NOTES_FILE"
          fi

          if gh release view v2.0.0 >/dev/null 2>&1; then
            gh release upload v2.0.0 runtime/Minecraft.exe runtime/Minecraft-Setup.exe --clobber
          fi
