name: Build & Release Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Rust toolchain & Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Locate Android SDK & NDK tools
        id: android
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "SDK=$SDK"
          BUILD_TOOLS="$(ls -d "$SDK"/build-tools/* 2>/dev/null | sort -V | tail -n1)"
          PLATFORM_DIR="$(ls -d "$SDK"/platforms/android-* 2>/dev/null | sort -V | tail -n1)"
          NDK_DIR="$(ls -d "$SDK"/ndk/* 2>/dev/null | sort -V | tail -n1 || true)"
          if [ -z "$NDK_DIR" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" "ndk;26.3.11579264" >/dev/null
            NDK_DIR="$SDK/ndk/26.3.11579264"
          fi
          echo "BUILD_TOOLS=$BUILD_TOOLS" >> "$GITHUB_ENV"
          echo "ANDROID_JAR=$PLATFORM_DIR/android.jar" >> "$GITHUB_ENV"
          echo "NDK_BIN=$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_ENV"
          echo "Found BUILD_TOOLS=$BUILD_TOOLS ANDROID_JAR=$PLATFORM_DIR/android.jar NDK_DIR=$NDK_DIR"

      - name: Build native Android libraries (arm64-v8a & armeabi-v7a)
        run: |
          mkdir -p build/apk_libs/lib/arm64-v8a build/apk_libs/lib/armeabi-v7a

          export AR_aarch64_linux_android="$NDK_BIN/llvm-ar"
          export CC_aarch64_linux_android="$NDK_BIN/aarch64-linux-android24-clang"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$NDK_BIN/aarch64-linux-android24-clang"
          cargo build --lib --release --target aarch64-linux-android
          "$NDK_BIN/aarch64-linux-android24-clang" -shared -O2 -Wall \
            android/app/src/main/cpp/jni_bridge.c \
            target/aarch64-linux-android/release/librustcraft.a \
            -Wl,--gc-sections -llog -lm -ldl -lc \
            -o build/apk_libs/lib/arm64-v8a/libminecraft.so
          "$NDK_BIN/llvm-strip" build/apk_libs/lib/arm64-v8a/libminecraft.so

          export AR_armv7_linux_androideabi="$NDK_BIN/llvm-ar"
          export CC_armv7_linux_androideabi="$NDK_BIN/armv7a-linux-androideabi24-clang"
          export CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER="$NDK_BIN/armv7a-linux-androideabi24-clang"
          cargo build --lib --release --target armv7-linux-androideabi
          "$NDK_BIN/armv7a-linux-androideabi24-clang" -shared -O2 -Wall \
            android/app/src/main/cpp/jni_bridge.c \
            target/armv7-linux-androideabi/release/librustcraft.a \
            -Wl,--gc-sections -llog -lm -ldl -lc \
            -o build/apk_libs/lib/armeabi-v7a/libminecraft.so
          "$NDK_BIN/llvm-strip" build/apk_libs/lib/armeabi-v7a/libminecraft.so

          ls -lh build/apk_libs/lib/*/*.so

      - name: Package & sign Minecraft-Mobile.apk
        run: |
          mkdir -p build/gen build/classes build/dex runtime
          "$BUILD_TOOLS/aapt2" compile --dir android/app/src/main/res -o build/res.zip
          "$BUILD_TOOLS/aapt2" link \
            -o build/unaligned.apk \
            -I "$ANDROID_JAR" \
            --manifest android/app/src/main/AndroidManifest.xml \
            -R build/res.zip \
            --java build/gen \
            --auto-add-overlay

          javac --release 11 -classpath "$ANDROID_JAR" -d build/classes \
            android/app/src/main/java/com/rustcraft/minecraft/MainActivity.java \
            build/gen/com/rustcraft/minecraft/R.java

          "$BUILD_TOOLS/d8" --release --min-api 24 --lib "$ANDROID_JAR" --output build/dex \
            $(find build/classes -name '*.class')

          zip -j build/unaligned.apk build/dex/classes.dex
          (cd build/apk_libs && zip -r ../../build/unaligned.apk lib)

          "$BUILD_TOOLS/zipalign" -f 4 build/unaligned.apk build/aligned.apk
          keytool -genkeypair -v -keystore build/release.keystore -alias rustcraft \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android -dname "CN=Rustcraft,O=MinecraftRust,C=US"
          "$BUILD_TOOLS/apksigner" sign \
            --ks build/release.keystore --ks-pass pass:android --key-pass pass:android \
            --out runtime/Minecraft-Mobile.apk build/aligned.apk
          ls -lh runtime/Minecraft-Mobile.apk

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: runtime/Minecraft-Mobile.apk

      - name: Publish Android .apk to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v2.1.0"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" runtime/Minecraft-Mobile.apk --clobber
          else
            gh release create "$TAG" runtime/Minecraft-Mobile.apk \
              --target main \
              --title "Minecraft Rust Edition ${TAG}" \
              --notes "Includes portable Windows executables and native Android APK (`Minecraft-Mobile.apk`, arm64-v8a + armeabi-v7a)."
          fi
          if gh release view v2.0.0 >/dev/null 2>&1; then
            gh release upload v2.0.0 runtime/Minecraft-Mobile.apk --clobber
          fi
